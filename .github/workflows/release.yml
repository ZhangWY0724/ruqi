name: 自动构建与发版 (Release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: '自动递增版本号类型（未填写自定义版本号时生效）'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      custom_version:
        description: '可选：手动指定版本号（如 1.2.0，留空则自动递增）'
        type: string
        required: false
        default: ''
      prerelease:
        description: '标记为预发布版本 (Pre-release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # 1. 计算版本号并自动打 Git Tag（如果是点击 Run workflow 触发）
  prepare:
    name: 计算版本号与标签
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      build_number: ${{ steps.ver.outputs.build_number }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - name: 检出完整历史与标签
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 计算版本号并推送 Tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUM=$((100 + GITHUB_RUN_NUMBER))
          PRERELEASE="false"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            if [[ "${VERSION}" == *-* ]]; then
              PRERELEASE="true"
            fi
          else
            PRERELEASE="${{ inputs.prerelease }}"
            CUSTOM="${{ inputs.custom_version }}"
            if [[ -n "${CUSTOM}" ]]; then
              VERSION="${CUSTOM#v}"
            else
              LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)
              if [[ -z "${LATEST_TAG}" ]]; then
                VERSION="1.0.0"
              else
                BASE="${LATEST_TAG#v}"
                BASE="${BASE%%-*}"
                IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE}"
                BUMP="${{ inputs.bump }}"
                case "${BUMP}" in
                  major)
                    MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                  minor)
                    MINOR=$((MINOR + 1)); PATCH=0 ;;
                  *)
                    PATCH=$((PATCH + 1)) ;;
                esac
                VERSION="${MAJOR}.${MINOR}.${PATCH}"
              fi
            fi

            TAG="v${VERSION}"
            if git rev-parse "${TAG}" >/dev/null 2>&1; then
              echo "错误：标签 ${TAG} 已存在，请检查版本号或使用新的递增类型。"
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${BUILD_NUM}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "准备发布版本：${TAG} (Build ${BUILD_NUM})"

  # 2. 核心单元测试门禁
  test-core:
    name: Core 单元测试门禁
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet test tests/Ruqi.Core.Tests/Ruqi.Core.Tests.csproj --configuration Release

  # 3. Android APK 构建（arm64 + 通用包，支持可选正式 Keystore 签名）
  build-android:
    name: 构建 Android APK
    needs: [ prepare, test-core ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '21'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 安装 maui-android 工作负载
        run: dotnet workload install maui-android

      - name: 准备 Android 签名参数（若配置了 Secrets 则启用正式签名）
        id: sign
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "${KEYSTORE_B64}" && -n "${KEYSTORE_PASS}" && -n "${KEY_ALIAS}" && -n "${KEY_PASS}" ]]; then
            echo "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/ruqi-release.keystore"
            echo "signed=true" >> "${GITHUB_OUTPUT}"
            echo "已启用正式 Android Keystore 签名"
          else
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            echo "未配置 Android 正式签名 Secrets，将使用默认开发签名打包"
          fi

      - name: 编译 Android arm64 APK
        shell: bash
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          SIGN_ARGS=""
          if [[ "${{ steps.sign.outputs.signed }}" == "true" ]]; then
            SIGN_ARGS="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=${RUNNER_TEMP}/ruqi-release.keystore -p:AndroidSigningStorePass=${KEYSTORE_PASS} -p:AndroidSigningKeyAlias=${KEY_ALIAS} -p:AndroidSigningKeyPass=${KEY_PASS}"
          fi
          dotnet publish src/Ruqi.App/Ruqi.App.csproj \
            -f net10.0-android \
            -p:RuqiTargetFramework=net10.0-android \
            -c Release \
            -r android-arm64 \
            -p:AndroidPackageFormat=apk \
            -p:ApplicationDisplayVersion="${{ needs.prepare.outputs.version }}" \
            -p:ApplicationVersion="${{ needs.prepare.outputs.build_number }}" \
            ${SIGN_ARGS}

          mkdir -p artifacts
          APK_FILE=$(find src/Ruqi.App/bin/Release/net10.0-android -name '*-Signed.apk' | head -n 1)
          cp "${APK_FILE}" "artifacts/Ruqi-${{ needs.prepare.outputs.tag }}-android-arm64.apk"

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v7
        with:
          name: artifact-android
          path: artifacts/*.apk

  # 4. Windows 绿色免安装版构建
  build-windows:
    name: 构建 Windows 便携版
    needs: [ prepare, test-core ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 安装 maui-windows 工作负载
        run: dotnet workload install maui-windows

      - name: 发布 Windows x64 绿色便携版并压缩
        shell: pwsh
        run: |
          dotnet publish src/Ruqi.App/Ruqi.App.csproj `
            -f net10.0-windows10.0.19041.0 `
            -p:RuqiTargetFramework=net10.0-windows10.0.19041.0 `
            -c Release `
            -r win-x64 `
            -p:SelfContained=true `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:ApplicationDisplayVersion="${{ needs.prepare.outputs.version }}" `
            -p:ApplicationVersion="${{ needs.prepare.outputs.build_number }}" `
            -o publish_win

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "publish_win\*" -DestinationPath "artifacts\Ruqi-${{ needs.prepare.outputs.tag }}-windows-x64.zip" -Force

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v7
        with:
          name: artifact-windows
          path: artifacts/*.zip

  # 5. 汇总产物并自动发布 GitHub Release
  publish-release:
    name: 发布 GitHub Release
    needs: [ prepare, build-android, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部平台产物
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: 生成 SHA256 校验文件
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: 创建并发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: 如期 ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## 「如期」${{ needs.prepare.outputs.tag }} 发布

            纯本地离线、免登录的人民币订阅管理与续费提醒账本。

            ### 下载与安装说明
            - **Android**：下载 `Ruqi-${{ needs.prepare.outputs.tag }}-android-arm64.apk` 直接安装（最低 Android 8.0）。
            - **Windows**：下载 `Ruqi-${{ needs.prepare.outputs.tag }}-windows-x64.zip` 解压后双击 `Ruqi.App.exe` 运行（免安装绿色版）。

            ---
          files: release-assets/*
