      <path d="M353 270 H681 C733 270 775 312 775 364 V396 H259 V364 C259 312 301 270 353 270 Z" fill="url(#header)"/>
      <path d="M259 396 H775" stroke="#E5F3FF" stroke-width="4" opacity="0.85"/>
      <g filter="url(#softShadow)">
        <rect x="369" y="222" width="60" height="122" rx="30" fill="url(#body)"/>
        <rect x="612" y="222" width="60" height="122" rx="30" fill="url(#body)"/>
      </g>
      <path d="M395 540 L476 616 L650 453" fill="none" stroke="url(#check)" stroke-width="57" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M565 715 C653 699 679 631 705 587 C720 559 746 538 775 539 V635 C775 681 738 715 691 715 Z" fill="url(#curl)" opacity="0.98"/>
    </g>
