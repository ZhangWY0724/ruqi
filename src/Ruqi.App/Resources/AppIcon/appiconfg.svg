<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#84C7FF"/>
      <stop offset="0.45" stop-color="#4F9CFA"/>
      <stop offset="1" stop-color="#1865DE"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#EEF6FF"/>
      <stop offset="1" stop-color="#B7D9FF"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0.65">
      <stop offset="0" stop-color="#90CDFF"/>
      <stop offset="0.5" stop-color="#2B81F5"/>
      <stop offset="1" stop-color="#8CC8FF"/>
    </linearGradient>
    <linearGradient id="check" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#67BBFF"/>
      <stop offset="1" stop-color="#276CEB"/>
    </linearGradient>
    <linearGradient id="curl" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#FCFEFF"/>
      <stop offset="0.45" stop-color="#D4E7FF"/>
      <stop offset="1" stop-color="#7DB7FF"/>
    </linearGradient>
    <filter id="calendarShadow" x="-30%" y="-30%" width="170%" height="185%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="21" result="blur"/>
      <feOffset in="blur" dx="0" dy="21" result="offset"/>
      <feComponentTransfer in="offset" result="shade"><feFuncA type="linear" slope="0.19"/></feComponentTransfer>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="s"/>
      <feOffset in="s" dy="7" dx="0" result="os"/>
      <feComponentTransfer in="os" result="shade"><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g>
    <!-- Orbit back layer: subscription renewal cycle. -->
    <path d="M173 523 C206 445 347 407 496 391 C683 372 851 401 881 477 C906 531 867 580 817 606" fill="none" stroke="url(#orbit)" stroke-width="35" stroke-linecap="round" opacity="0.56"/>
